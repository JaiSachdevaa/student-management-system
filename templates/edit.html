{% extends "base.html" %}
{% block title %}Edit student | Student Management System{% endblock %}
{% block content %}
<div class="card form-card">
  <h2>Edit student #{{ student.id }}</h2>

  {% if error %}
    <div class="error-box">{{ error }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('edit_student', student_id=student.id) }}">
    <div class="field"><label for="name">Full name</label><input id="name" name="name" value="{{ form.get('name', '') }}" required></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required></div>
    <div class="field"><label for="course">Course</label><input id="course" name="course" value="{{ form.get('course', '') }}" required></div>
    <div class="field">
      <label for="year">Year</label>
      <select id="year" name="year">
        {% for y in range(1, 7) %}
          <option value="{{ y }}" {% if form.get('year')|string == y|string %}selected{% endif %}>Year {{ y }}</option>
        {% endfor %}
      </select>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn" type="submit">Save changes</button>
      <a class="btn btn-ghost" href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
