<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Management System{% endblock %}</title>
  <script>
    (function () {
      var theme = "light";
      try {
        var saved = localStorage.getItem("sms-theme");
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        theme = saved || (dark ? "dark" : "light");
      } catch (e) {
        theme = "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      --bg: #f4f5fb;
      --card: #ffffff;
      --text: #1d2333;
      --muted: #667085;
      --border: #e5e7f0;
      --primary: #4f46e5;
      --primary-soft: #eef0ff;
      --btn-1: #4f46e5;
      --btn-2: #7c3aed;
      --danger: #e11d48;
      --danger-soft: #ffe4ea;
      --success: #059669;
      --success-soft: #d9f7ec;
      --info: #2563eb;
      --info-soft: #e0ecff;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 8px 24px rgba(16, 24, 40, 0.06);
    }
    [data-theme="dark"] {
      --bg: #0e1120;
      --card: #171b2e;
      --text: #e9ebf5;
      --muted: #98a2b8;
      --border: #262b45;
      --primary: #a5b4fc;
      --primary-soft: #232849;
      --danger: #fb7185;
      --danger-soft: #3a1c28;
      --success: #34d399;
      --success-soft: #143328;
      --info: #7aa7ff;
      --info-soft: #1c2a4a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

    .topbar { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--border); }
    .topbar .container { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--text); }
    .brand:hover { text-decoration: none; }
    .brand-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--btn-1), var(--btn-2)); }
    .nav { display: flex; align-items: center; gap: 6px; }
    .nav a { color: var(--muted); padding: 8px 12px; border-radius: 8px; font-weight: 500; }
    .nav a:hover { background: var(--primary-soft); color: var(--primary); text-decoration: none; }
    .icon-btn { display: grid; place-items: center; border: 1px solid var(--border); background: var(--card); color: var(--text); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 1.05rem; }
    .icon-btn:hover { background: var(--primary-soft); }

    .hero { margin: 24px 0; padding: 36px; border-radius: 20px; color: #fff; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #db2777 100%); box-shadow: var(--shadow); }
    .hero h1 { margin: 0 0 6px; font-size: 2rem; letter-spacing: -0.02em; }
    .hero p { margin: 0; opacity: 0.9; max-width: 560px; }

    .toasts { position: fixed; top: 76px; right: 20px; z-index: 50; display: grid; gap: 10px; }
    .toast { padding: 12px 16px; border-radius: 12px; font-weight: 500; box-shadow: var(--shadow); border: 1px solid var(--border); background: var(--card); animation: slide 0.25s ease-out; }
    .toast.success { background: var(--success-soft); color: var(--success); }
    .toast.error { background: var(--danger-soft); color: var(--danger); }
    .toast.info { background: var(--info-soft); color: var(--info); }
    @keyframes slide { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); }
    .stat-label { display: block; color: var(--muted); font-size: 0.85rem; font-weight: 500; }
    .stat-value { display: block; font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }

    main, aside { min-width: 0; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; margin-bottom: 40px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; }
    .card + .card { margin-top: 20px; }
    .card h2 { margin: 0 0 14px; font-size: 1.05rem; }

    .toolbar { display: grid; grid-template-columns: 1.5fr 1fr 0.9fr 1.3fr auto; gap: 10px; margin-bottom: 16px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 0.95rem; font-family: inherit; }
    input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .field { margin-bottom: 12px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border: 0; border-radius: 10px; font-weight: 600; font-size: 0.92rem; cursor: pointer; font-family: inherit; color: #fff; background: linear-gradient(135deg, var(--btn-1), var(--btn-2)); }
    .btn:hover { filter: brightness(1.08); text-decoration: none; }
    .btn-block { width: 100%; }
    .btn-ghost { background: var(--primary-soft); color: var(--primary); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; }
    form.inline { display: inline; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    th { text-align: left; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); }
    td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--primary-soft); }
    .person { display: flex; align-items: center; gap: 12px; }
    .person strong { display: block; }
    .person small { color: var(--muted); }
    .avatar { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; color: #fff; background: hsl(var(--h) 65% 48%); flex-shrink: 0; }
    .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 600; font-size: 0.8rem; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--info-soft); color: var(--info); font-weight: 600; font-size: 0.8rem; }
    .muted { color: var(--muted); }
    .actions { white-space: nowrap; text-align: right; }

    .pager { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; color: var(--muted); font-size: 0.9rem; }
    .pager .links { display: flex; gap: 8px; }
    .empty { text-align: center; padding: 36px 12px; color: var(--muted); }
    .empty strong { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: 4px; }

    .error-box { background: var(--danger-soft); color: var(--danger); padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-weight: 500; }

    .bar-row { display: grid; grid-template-columns: 70px 1fr 28px; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 0.88rem; }
    .bar { height: 10px; border-radius: 999px; background: var(--primary-soft); overflow: hidden; }
    .bar span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--btn-1), var(--btn-2)); }
    .bar-count { text-align: right; font-weight: 600; }
    .tools { display: grid; gap: 10px; }

    .form-card { max-width: 520px; margin: 32px auto; }
    .method { display: inline-block; min-width: 64px; text-align: center; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 0.78rem; color: #fff; }
    .m-get { background: #059669; }
    .m-post { background: #2563eb; }
    .m-put { background: #d97706; }
    .m-delete { background: #e11d48; }
    pre { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; overflow-x: auto; font-size: 0.85rem; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

    footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 24px 0 36px; }

    @media (max-width: 960px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar .search { grid-column: 1 / -1; }
    }
    @media (max-width: 560px) {
      .hero { padding: 24px; }
      .hero h1 { font-size: 1.5rem; }
      .nav a.hide-sm { display: none; }
      .brand-text { font-size: 0.95rem; }
      .toolbar { grid-template-columns: 1fr; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>
        </span>
        <span class="brand-text">Student Management System</span>
      </a>
      <nav class="nav">
        <a class="hide-sm" href="{{ url_for('index') }}">Dashboard</a>
        <a class="hide-sm" href="{{ url_for('api_docs') }}">API docs</a>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
      </nav>
    </div>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="toasts">
      {% for category, message in messages %}
        <div class="toast {{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
  {% endwith %}

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <footer>Built with Flask, Docker and GitHub Actions</footer>

  <script>
    document.getElementById("theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("sms-theme", next); } catch (e) {}
    });
    document.querySelectorAll("form[data-confirm]").forEach(function (form) {
      form.addEventListener("submit", function (event) {
        if (!window.confirm(form.dataset.confirm)) { event.preventDefault(); }
      });
    });
    setTimeout(function () {
      document.querySelectorAll(".toast").forEach(function (toast) { toast.remove(); });
    }, 4500);
  </script>
</body>
</html>
